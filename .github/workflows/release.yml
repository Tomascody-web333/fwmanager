# Push a tag such as v0.1.0 (the version in pyproject.toml): this builds the .deb, checks it,
# and publishes it with SHA256SUMS as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common python3-pytest \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi

      - name: Unit tests and package tests
        run: /usr/bin/python3 -m pytest -q -p no:cacheprovider tests/unit tests/install/test_deb.py

      - name: Build
        run: packaging/deb/build-deb.sh --out dist

      - name: Check
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          dpkg-deb --info fwmanager.*.deb

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sed "s/@VERSION@/$version/g" packaging/deb/release-notes.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/fwmanager.*.deb dist/SHA256SUMS \
            --title "fwmanager $version" --notes-file dist/notes.md
