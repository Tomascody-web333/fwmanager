<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root owns the name. -->
  <policy user="root">
    <allow own="org.fwmanager.Control"/>
  </policy>

  <!-- Only members of the fwmanager group may talk to the daemon
       (the daemon re-checks the caller's UID itself). -->
  <policy group="fwmanager">
    <allow send_destination="org.fwmanager.Control"/>
    <allow receive_sender="org.fwmanager.Control"/>
  </policy>

  <!-- Everyone else is denied. -->
  <policy context="default">
    <deny own="org.fwmanager.Control"/>
    <deny send_destination="org.fwmanager.Control"/>
  </policy>
</busconfig>
