[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwmanager"
version = "0.1.0"
description = "Beginner-friendly graphical interface for ufw, with profiles per network"
readme = "README.md"
license = { file = "LICENSE" }  # PolyForm Noncommercial 1.0.0
classifiers = ["License :: Other/Proprietary License"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fwmanager-cli = "fwmanager.cli.main:main"
fwmanagerd = "fwmanager.daemon.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fwmanager = ["data/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ui: GTK windows, run against a virtual X server (Xvfb)",
    "integration: needs root and a real nft binary (runs inside a private network namespace)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
